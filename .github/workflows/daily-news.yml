name: Autonomous Daily AI News Pipeline

on:
  workflow_dispatch: # Manual trigger only so automated bot never injects external Unsplash URLs or template headings

concurrency:
  group: news-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-news:
    name: Aggregate AI News from Wired, TechRadar & Google News
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch, Translate & Sync AI News
        run: |
          python3 scripts/fetch_daily_news.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(news): autonomous daily AI news update"
          file_pattern: "src/data/articles.json src/data/live_wire.json"
          commit_user_name: "Deep Intelligence Bot"
          commit_user_email: "actions@github.com"
