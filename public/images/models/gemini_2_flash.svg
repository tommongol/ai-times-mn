<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Border Accent -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Top Terminal Bar -->
  <rect x="35" y="35" width="730" height="45" fill="rgba(0,0,0,0.5)" rx="4"/>
  <circle cx="55" cy="57" r="5" fill="#EF4444"/>
  <circle cx="70" cy="57" r="5" fill="#F59E0B"/>
  <circle cx="85" cy="57" r="5" fill="#10B981"/>
  <text x="105" y="62" font-family="monospace" font-size="13" font-weight="bold" fill="#38BDF8" letter-spacing="2">// GOOGLE DEEPMIND // MULTIMODAL</text>
  <text x="740" y="62" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#A1A1AA">BENCHMARK VERIFIED</text>

  <!-- Icon Showcase -->
  <g transform="translate(60, 110)">
    <path d="M50 15 L58 42 L85 50 L58 58 L50 85 L42 58 L15 50 L42 42 Z" fill="#38BDF8"/>
  </g>

  <!-- Model Title -->
  <text x="180" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">GEMINI 2.0 FLASH & 4</text>
  <text x="180" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">Realtime Audio/Video Streaming + 1M Context + Deep Research</text>

  <!-- Divider Line -->
  <line x1="50" y1="230" x2="750" y2="230" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Benchmark Badges Grid -->
  <g transform="translate(50, 260)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="215" height="95" fill="rgba(0,0,0,0.4)" stroke="#38BDF8" stroke-width="1.5" rx="6"/>
    <text x="20" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#94A3B8" letter-spacing="1">KEY METRIC 01</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Multimodal Native</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="215" height="95" fill="rgba(0,0,0,0.4)" stroke="#38BDF8" stroke-width="1.5" rx="6"/>
    <text x="260" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#94A3B8" letter-spacing="1">KEY METRIC 02</text>
    <text x="260" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Live Audio Latency: 250ms</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="220" height="95" fill="rgba(0,0,0,0.4)" stroke="#38BDF8" stroke-width="1.5" rx="6"/>
    <text x="500" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#94A3B8" letter-spacing="1">KEY ARCHITECTURE</text>
    <text x="500" y="68" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Self-Correcting Agents</text>
  </g>

  <!-- Bottom Ticker -->
  <rect x="35" y="415" width="730" height="45" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="4"/>
  <text x="55" y="442" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8">AI TIMES SPECIAL REPORT</text>
  <text x="740" y="442" text-anchor="end" font-family="monospace" font-size="11" fill="#71717A">DISPATCH EDITION // PROD RELEASE</text>
</svg>