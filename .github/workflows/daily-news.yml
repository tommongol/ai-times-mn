name: Autonomous Daily AI News Pipeline

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: news-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-news:
    name: Aggregate AI News from Wired, TechRadar & Google News
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for local cover generation
        run: pip install pillow

      - name: Fetch, Translate & Sync AI News
        run: |
          python3 scripts/fetch_daily_news.py
          node scripts/guard.mjs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(news): autonomous daily AI news update"
          file_pattern: "src/data/articles.json public/images/articles/"
          commit_user_name: "AI Times Bot"
          commit_user_email: "actions@github.com"
